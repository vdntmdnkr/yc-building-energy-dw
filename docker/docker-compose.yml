version: '3.8'

services:

  # -------------------------------------------------------------------
  # PostgreSQL – Batch Data Warehouse (Local Law 84 star schema)
  # -------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: building_energy_postgres
    environment:
      POSTGRES_DB: building_energy_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/batch_dw:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d building_energy_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Citus – Distributed / columnar DW coordinator node
  # -------------------------------------------------------------------
  citus:
    image: citusdata/citus:12.1
    container_name: building_energy_citus
    # Coordinator node – worker nodes can be added via citus_add_node()
    environment:
      POSTGRES_DB: building_energy_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - citus_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d building_energy_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Zookeeper – required by Kafka
  # -------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: building_energy_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Kafka – streaming ingestion broker
  # -------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: building_energy_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------
  # ClickHouse – real-time OLAP store for streaming analytics
  # -------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: building_energy_clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../streaming/clickhouse_setup.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Grafana – dashboarding for real-time ClickHouse metrics
  # -------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.0
    container_name: building_energy_grafana
    depends_on:
      - clickhouse
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../streaming/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/building_energy.json
    restart: unless-stopped

# -------------------------------------------------------------------
# Named volumes (persist data between container restarts)
# -------------------------------------------------------------------
volumes:
  postgres_data:
  citus_data:
  clickhouse_data:
  grafana_data:
